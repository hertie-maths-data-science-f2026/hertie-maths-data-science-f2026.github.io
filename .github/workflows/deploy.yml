# SYSTEM-OWNED - do not edit. Written by the DSL course sync from templates/site/ in the
# toolkit; every sync rewrites it.
#
# Builds the site with Jekyll and publishes it to GitHub Pages. Every sync pushes, and
# every push runs this.
name: Deploy course website

on:
  # A site repo has one branch, whichever it was born with: older sites are on `master`.
  push:
    branches: [main, master]
  # Dispatched by dsl-jekyll-theme when the shared theme changes, with a monthly backstop
  # in case a dispatch is missed.
  repository_dispatch:
    types: [theme-updated]
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
          # jekyll-remote-theme needs a token to fetch the shared theme repo.
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # jekyll-github-metadata synthesises site.title/description and refuses to build
          # unless it is told which repo it is attributing them to.
          PAGES_REPO_NWO: ${{ github.repository }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --baseurl "$BASE_PATH"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
